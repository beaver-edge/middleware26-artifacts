# MAINTAINER ONLY: build the linux/amd64 evaluation image natively.
# Arduino CLI crashes under amd64 emulation on Apple Silicon,
# so the amd64 image is built on a native GitHub-hosted x86_64 runner.
# Runs on every push to the artifact-eval-access branch, or manually from the
# Actions tab once this file is on the default branch.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write scope).
name: Build amd64 image

on:
  push:
    branches: [artifact-eval-access]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push
        default: noahwu/beaver-edge:middleware26-amd64
        required: true

env:
  TAG: ${{ inputs.tag || 'noahwu/beaver-edge:middleware26-amd64' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space for the ~4 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        run: docker build --platform linux/amd64 -t "${{ env.TAG }}" .

      - name: Offline self-test inside the image
        run: docker run --rm "${{ env.TAG }}" bash -c 'uname -m && python -m pytest tests -q && arduino-cli version'

      - name: Refuse to push an image that contains credentials
        run: |
          found=$(docker run --rm "${{ env.TAG }}" find / -xdev \( -name .env -o -name 'id_ed25519*' -o -name credentials.tar.gz.enc -o -name .credentials-password -o -path '*eval-ssh*' \) 2>/dev/null || true)
          if [ -n "$found" ]; then echo "credentials found in image:"; echo "$found"; exit 1; fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: docker push "${{ env.TAG }}"
